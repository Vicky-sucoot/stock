name: pages

# 免費發布網頁版 App（PWA）到 GitHub Pages：https://<帳號>.github.io/stock/
# 內含最新的官方收盤價檔（政府開放資料，附來源標示）；**不含觀察名單、不含任何個人資料**。
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "backend/dca_backend/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["ingest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach data-branch FETCH_HEAD
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e backend

      - name: Export official closing prices
        working-directory: backend
        run: |
          if [ -d ../data-branch/raw ]; then
            python -m dca_backend.export_quotes --raw-dir ../data-branch/raw --out ../web/public/data/quotes.json
          else
            echo "no data branch yet; app will show manual prices only"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
