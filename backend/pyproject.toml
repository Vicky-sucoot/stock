[project]
name = "dca-backend"
version = "0.1.0"
description = "定期定額投資管理 App 後端：公開市場資料管線與唯讀 API（不含任何使用者資料）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
llm = ["anthropic"]
viewer = ["streamlit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dca_backend"]
